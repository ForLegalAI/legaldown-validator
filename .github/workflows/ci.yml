name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  conformance:
    name: Specification conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the LegalDown specification (fixtures corpus)
        uses: actions/checkout@v4
        with:
          repository: ForLegalAI/LegalDown
          ref: v0.1
          path: .legaldown-spec
          # A private specification repository needs a token with read access;
          # GITHUB_TOKEN cannot read another repository.
          token: ${{ secrets.SPEC_REPO_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Validate against the fixtures corpus
        env:
          LEGALDOWN_FIXTURES_DIR: .legaldown-spec/fixtures
        # Cases for unimplemented rules are skipped and named, so a failure
        # here is a regression against a rule this implementation claims.
        run: pytest tests/conformance -q

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build twine
      - run: python -m build
      - name: Check package metadata
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
