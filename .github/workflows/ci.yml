name: CI

# On demand only: Actions → CI → Run workflow (pick the branch). One job on one
# Python, the one the release is built with, so a run costs one runner's setup
# rather than six: lint, the tests (with the specification fixtures corpus
# unless switched off), and the build with its metadata check.

on:
  workflow_dispatch:
    inputs:
      conformance:
        description: "Also run the specification fixtures corpus (checks out ForLegalAI/LegalDown)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check out the LegalDown specification (fixtures corpus only)
        if: inputs.conformance
        uses: actions/checkout@v4
        with:
          repository: ForLegalAI/LegalDown
          ref: v0.2
          path: .legaldown-spec
          sparse-checkout: fixtures
          # A private specification repository needs a token with read access;
          # GITHUB_TOKEN cannot read another repository.
          token: ${{ secrets.SPEC_REPO_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The dev extra holds pytest, ruff, build and twine: one install for every step.
      - run: pip install -e ".[dev]"

      - run: ruff check .

      - name: Tests and specification conformance
        if: inputs.conformance
        env:
          LEGALDOWN_FIXTURES_DIR: .legaldown-spec/fixtures
        # Cases for unimplemented rules are skipped and named, so a failure in
        # tests/conformance is a regression against a rule this implementation claims.
        run: pytest -q

      - name: Tests
        if: ${{ !inputs.conformance }}
        run: pytest -q

      - run: python -m build

      - name: Check package metadata
        # --strict matches the publish workflow, so a metadata problem fails
        # here rather than at release time.
        run: twine check --strict dist/*
