name: CI

# On demand only, in either of two ways:
#   - Actions → CI → Run workflow, on the branch you pick;
#   - the `ci` label on a pull request: adding it runs CI, and CI then runs again
#     on each push to that pull request until the label is removed.
# One job on one Python, the one the release is built with, so a run costs one
# runner's setup rather than six: lint, the tests (with the specification fixtures
# corpus unless switched off), and the build with its metadata check.

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:
    inputs:
      conformance:
        description: "Also run the specification fixtures corpus (checks out ForLegalAI/LegalDown)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, build
    # A push or a reopening of a pull request runs it only while the pull request has
    # the `ci` label; adding some other label does not.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'ci') &&
       (github.event.action != 'labeled' || github.event.label.name == 'ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The corpus is checked out and run for a pull request, and for a manual run
      # unless its `conformance` input is off.
      - name: Check out the LegalDown specification (fixtures corpus only)
        if: github.event_name != 'workflow_dispatch' || inputs.conformance
        uses: actions/checkout@v4
        with:
          repository: ForLegalAI/LegalDown
          ref: v0.2
          path: .legaldown-spec
          sparse-checkout: fixtures
          # A private specification repository needs a token with read access;
          # GITHUB_TOKEN cannot read another repository.
          token: ${{ secrets.SPEC_REPO_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The dev extra holds pytest, ruff, build and twine: one install for every step.
      - run: pip install -e ".[dev]"

      - run: ruff check .

      - name: Tests and specification conformance
        if: github.event_name != 'workflow_dispatch' || inputs.conformance
        env:
          LEGALDOWN_FIXTURES_DIR: .legaldown-spec/fixtures
        # Cases for unimplemented rules are skipped and named, so a failure in
        # tests/conformance is a regression against a rule this implementation claims.
        run: pytest -q

      - name: Tests
        if: github.event_name == 'workflow_dispatch' && !inputs.conformance
        run: pytest -q

      - run: python -m build

      - name: Check package metadata
        # --strict matches the publish workflow, so a metadata problem fails
        # here rather than at release time.
        run: twine check --strict dist/*
