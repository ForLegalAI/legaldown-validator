name: Publish

# Publishes the distribution to PyPI via Trusted Publishing (OIDC) — no API
# token is stored in this repository. See .github/PUBLISHING.md for the one-time PyPI
# setup that must exist before the first run.
#
# Triggers:
#   - publishing a GitHub Release  → build, verify, upload to PyPI
#   - manual dispatch              → build, verify, upload to TestPyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to upload the built distribution"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check package metadata renders on PyPI
        run: twine check --strict dist/*

      - name: Verify the version matches the release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, pathlib, re, sys

          tag = os.environ["TAG"].lstrip("v")
          init = pathlib.Path("src/legaldown/__init__.py").read_text(encoding="utf-8")
          version = re.search(r'__version__ = "([^"]+)"', init).group(1)
          if version != tag:
              sys.exit(
                  f"::error::Release tag {tag!r} does not match __version__ {version!r}. "
                  "Bump src/legaldown/__init__.py before tagging."
              )
          print(f"version {version} matches tag {tag}")
          PY

      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/legaldown --version
          /tmp/smoke/bin/python -c "import legaldown; print(legaldown.SPEC_VERSION, legaldown.CONFORMANCE_LEVEL)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: Upload to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/legaldown-validator
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Upload to PyPI
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/legaldown-validator
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
